name: CI/CD (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "supabase/**"
      - "data/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "vitest.config.js"
      - "tailwind.config.js"
      - "postcss.config.js"
      - "jsconfig.json"
      - "eslint.config.js"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "supabase/**"
      - "data/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "vitest.config.js"
      - "tailwind.config.js"
      - "postcss.config.js"
      - "jsconfig.json"
      - "eslint.config.js"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, tipos, testes, dados e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências (lockfile)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm run test

      - name: Testes de banco (RLS + funções de acesso)
        run: npm run test:db

      - name: Validar banco de questões
        run: npm run validar:dados

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Conferir artefato de dados
        run: test -s dist/dados/questoes.json

      - name: Preparar Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publicar no GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: verificar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
